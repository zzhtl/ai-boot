[workspace]
members = ["crates/ai-boot-feishu", "crates/ai-boot"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
ai-boot-feishu = { path = "crates/ai-boot-feishu" }

anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# 长连接的帧是 proto2 的两条消息，手写 derive 即可，不引入 prost-build/protoc。
prost = "0.14"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "thread_rng"] }
reqwest = { version = "0.13", default-features = false, features = [
    "http2",
    "json",
    # 上传卡片里显示的图片（im/v1/images 只收 multipart）
    "multipart",
    "query",
    "rustls",
    # 内网与企业环境可能装了自有 CA，统一读系统证书库，和 qtmcp 保持一致。
    "rustls-native-certs",
] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
thiserror = "2.0"
tokio = { version = "1.53", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.24", features = ["v5", "v7"] }

# dev-dependencies
tempfile = "3"
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
